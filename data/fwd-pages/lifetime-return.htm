vironment":"bltd9555cb702e86a9a","locale":"th-th","time":"2024-11-11T10:14:41.916Z","user":"blt7ce1a6c426702495"}}]}},{"support_section":{"faqs_reference":[{"uid":"blt90af8fdd29defcc9","_content_type_uid":"product_details_faqs","_version":5,"locale":"th-th","ACL":{},"_in_progress":false,"anchoring":"faq","block_description":"","block_title":"คำถามที่พบบ่อย","button":{"button_icon":"arrow-right","button_title":"คำถามทั้งหมด","button_url":"/support/faq/","open_in_new_tab":false,"button_design":null,"ga_label":""},"created_at":"2022-09-12T06:43:03.883Z","created_by":"blt67f4ad0c4ce9604c","faqs":[{"question":"การชำระเบี้ยประกันสามารถทำได้โดยวิธีใดบ้าง?","_metadata":{"uid":"csf35285daae397085"},"question_rich_text":"","answer":"\u003cp\u003eกรุณาคลิกดูรายละเอียด วิธีชำระเบี้ยประกัน\u0026nbsp;\u003ca href=\"/support/premium-payment/\" target=\"_blank\"\u003e\u003cu\u003eที่นี่\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"},{"question":"เราควรทำประกันชีวิตจำนวนเท่าไหร่?","_metadata":{"uid":"csc52eaa0b6de50bb7"},"question_rich_text":"","answer":"\u003cp\u003eนี่เป็นเรื่องที่คุณต้องตัดสินใจอย่างถี่ถ้วน และเราขอแนะนำว่า ก่อนอื่นเลย คุณต้องหาเหตุผลความจำเป็นว่าทำไมถึงต้องมีประกันชีวิต\u003c/p\u003e\u003cp\u003eตัวอย่างเช่น ถ้าคุณต้องการมีเงินเก็บ 2 ล้านบาทเพื่อใช้จ่ายหลังเกษียณ คุณต้องเลือกแบบประกันที่มีเงินออมให้คุณได้เท่ากับ 2 ล้านบาทในอนาคต\u003c/p\u003e\u003cp\u003eทั้งนี้ คุณต้องพิจารณาความสามารถในการชำระเบี้ยประกัน (รายเดือนหรือรายปี) ให้สอดคล้องกับรายรับของคุณด้วย ก่อนจะตัดสินใจเลือกแผนประกันชีวิตและค่าเบี้ยประกัน\u003c/p\u003e\u003cp\u003eเรายินดีให้คำปรึกษา หรือสามารถติดต่อผู้เชี่ยวชาญทางการเงินของเราได้ตลอดเวลา เพราะเราเข้าใจทุกความต้องการและสถานการณ์ที่แตกต่างของแต่ละคน\u003c/p\u003e"},{"question":"ชำระเบี้ยประกันเป็นรายเดือนอยู่ อยากให้หักบัญชีเงินเดือนเลยจะได้ไหม?","_metadata":{"uid":"csc1f735f3072b41b6"},"question_rich_text":"","answer":"\u003cp\u003eคุณสามารถชำระเบี้ยประกัน ผ่านบริการหักบัญชีออมทรัพย์อัตโนมัติ ได้ที่\u003c/p\u003e\u003cul\u003e\u003cli\u003eธ.กรุงเทพ\u003c/li\u003e\u003cli\u003eธ.กรุงศรีอยุธยา\u003c/li\u003e\u003cli\u003eธ.กสิกรไทย\u003c/li\u003e\u003cli\u003eธ.ไทยพาณิชย์\u003c/li\u003e\u003cli\u003eธ. กรุงไทย\u003c/li\u003e\u003cli\u003eธ. ทหารไทย\u003c/li\u003e\u003cli\u003eธ.ออมสิน\u003c/li\u003e\u003cli\u003eธ.ธนชาติ\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eกรุณาคลิกดูรายละเอียด วิธีชำระเบี้ยประกัน\u0026nbsp;\u003ca href=\"/support/premium-payment/\" target=\"_blank\"\u003e\u003cu\u003eที่นี่\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"},{"question":"ต้องการเปลี่ยนแปลงบัตรเครดิตในการชำระเบี้ยประกันภัย ต้องทำอย่างไร?","_metadata":{"uid":"cs475bea6248a0f536"},"question_rich_text":"","answer":"\u003cp\u003eสามารถยื่นคำขอเปลี่ยนแปลงบัตรเครดิตได้ด้วยตนเอง ผ่านแอป\u0026nbsp;\u003ca href=\"/omne/1step-registration-support/?utm_source=fwdcoth\u0026utm_medium=support_allfaq_support_section\u0026utm_campaign=omne_1stepregistration_download\" target=\"_blank\"\u003e\u003cu\u003eOmne by FWD\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"},{"question":"ควรทำอย่างไร ถ้าหากมีปัญหาทางการเงินไม่สามารถชำระเบี้ยประกันต่อได้?","_metadata":{"uid":"csc8b96341324cbbbf"},"question_rich_text":"","answer":"\u003cp\u003eบริษัทพร้อมที่จะดูแลช่วยเหลือคุณ หากประสบปัญหาไม่สามารถชำระเบี้ยประกันต่อได้ ยังมีหลากหลายทางเลือกเพื่อช่วยผ่อนคลายปัญหาของคุณ ดังต่อไปนี้\u003c/p\u003e\u003cul\u003e\u003cli\u003eหากคุณต้องการเปลี่ยนแปลงการชำระเบี้ยประกันภัย ไม่ว่าจะเป็นจำนวนเงินหรือระยะเวลาในการจ่าย ติดต่อเข้ามาพูดคุยกับเรา ให้เราช่วยนำเสนอรูปแบบที่เหมาะสมสำหรับคุณ\u003c/li\u003e\u003cli\u003eขอชำระเบี้ยประกันด้วยเงินปันผลที่สะสมไว้ในกรมธรรม์ ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/cash-return-options/\" target=\"_blank\"\u003e\u003cu\u003eวิธีรับเงินคืน\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eกู้ยืมเงินจากกรมธรรม์ทั้งหมด หรือบางส่วนของมูลค่าเงินสด เพื่อนำมาชำระเบี้ยประกัน ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/loan-application/\" target=\"_blank\"\u003e\u003cu\u003eบริการเงินกู้ตามกรมธรรม์\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eตัดสัญญาเพิ่มเติมบางรายการเพื่อลดจำนวนเบี้ยประกันลง\u003c/li\u003e\u003cli\u003eลดทุนประกันเพื่อลดจำนวนเบี้ยประกันที่ต้องชำระ (การลดทุนประกันมีผลทำให้ความคุ้มครองนั้นน้อยลงไปด้วย)\u003c/li\u003e\u003cli\u003eเปลี่ยนแบบประกันให้สอดคล้องกับความสามารถในการชำระเบี้ย\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eคือแนวทางในการแก้ปัญหาทั้งหมด แต่ก่อนตัดสินใจขอให้คุณมั่นใจว่าคุณได้ปรึกษาเราเพื่อหาแนวทางที่ดีที่สุดสำหรับคุณ เพราะเมื่อคุณประสบปัญหาทางการเงิน การละทิ้งกรมธรรม์หรือหายไปเฉยๆ นั้นไม่ใช่ทางออกที่ดี นอกจากจะทำให้ความคุ้มครองจากกรมธรรม์ของคุณสิ้นสุดลงแล้ว ยังทำให้คุณสูญเสียเบี้ยประกันส่วนหนึ่งที่ได้ชำระไปแล้วอีกด้วย\u003c/p\u003e\u003cp\u003eหากคุณประสบปัญหา เราพร้อมช่วยเหลือและยินดีเสนอแนวทางในกรณีที่มีปัญหาการชำระค่าเบี้ยประกัน ติดต่อหาเราที่โทร.\u0026nbsp;\u003ca href=\"tel:1351\"\u003e1351\u003c/a\u003e\u003c/p\u003e"}],"tags":[],"title":"FWD Life Saving 18/9 insurance","updated_at":"2023-04-25T09:25:05.973Z","updated_by":"blt96e98488d2398187","publish_details":{"environment":"bltd9555cb702e86a9a","locale":"th-th","time":"2024-01-10T08:12:59.466Z","user":"blt7ce1a6c426702495"},"faq_schema":[{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"การชำระเบี้ยประกันสามารถทำได้โดยวิธีใดบ้าง?","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eกรุณาคลิกดูรายละเอียด วิธีชำระเบี้ยประกัน\u0026nbsp;\u003ca href=\"/support/premium-payment/\" target=\"_blank\"\u003e\u003cu\u003eที่นี่\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"}},{"@type":"Question","name":"เราควรทำประกันชีวิตจำนวนเท่าไหร่?","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eนี่เป็นเรื่องที่คุณต้องตัดสินใจอย่างถี่ถ้วน และเราขอแนะนำว่า ก่อนอื่นเลย คุณต้องหาเหตุผลความจำเป็นว่าทำไมถึงต้องมีประกันชีวิต\u003c/p\u003e\u003cp\u003eตัวอย่างเช่น ถ้าคุณต้องการมีเงินเก็บ 2 ล้านบาทเพื่อใช้จ่ายหลังเกษียณ คุณต้องเลือกแบบประกันที่มีเงินออมให้คุณได้เท่ากับ 2 ล้านบาทในอนาคต\u003c/p\u003e\u รือระยะเวลาในการจ่าย ติดต่อเข้ามาพูดคุยกับเรา ให้เราช่วยนำเสนอรูปแบบที่เหมาะสมสำหรับคุณ\u003c/li\u003e\u003cli\u003eขอชำระเบี้ยประกันด้วยเงินปันผลที่สะสมไว้ในกรมธรรม์ ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/cash-return-options/\" target=\"_blank\"\u003e\u003cu\u003eวิธีรับเงินคืน\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eกู้ยืมเงินจากกรมธรรม์ทั้งหมด หรือบางส่วนของมูลค่าเงินสด เพื่อนำมาชำระเบี้ยประกัน ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/loan-application/\" target=\"_blank\"\u003e\u003cu\u003eบริการเงินกู้ตามกรมธรรม์\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eตัดสัญญาเพิ่มเติมบางรายการเพื่อลดจำนวนเบี้ยประกันลง\u003c/li\u003e\u003cli\u003eลดทุนประกันเพื่อลดจำนวนเบี้ยประกันที่ต้องชำระ (การลดทุนประกันมีผลทำให้ความคุ้มครองนั้นน้อยลงไปด้วย)\u003c/li\u003e\u003cli\u003eเปลี่ยนแบบประกันให้สอดคล้องกับความสามารถในการชำระเบี้ย\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eคือแนวทางในการแก้ปัญหาทั้งหมด แต่ก่อนตัดสินใจขอให้คุณมั่นใจว่าคุณได้ปรึกษาเราเพื่อหาแนวทางที่ดีที่สุดสำหรับคุณ เพราะเมื่อคุณประสบปัญหาทางการเงิน การละทิ้งกรมธรรม์หรือหายไปเฉยๆ นั้นไม่ใช่ทางออกที่ดี นอกจากจะทำให้ความคุ้มครองจากกรมธรรม์ของคุณสิ้นสุดลงแล้ว ยังทำให้คุณสูญเสียเบี้ยประกันส่วนหนึ่งที่ได้ชำระไปแล้วอีกด้วย\u003c/p\u003e\u003cp\u003eหากคุณประสบปัญหา เราพร้อมช่วยเหลือและยินดีเสนอแนวทางในกรณีที่มีปัญหาการชำระค่าเบี้ยประกัน ติดต่อหาเราที่โทร.\u0026nbsp;\u003ca href=\"tel:1351\"\u003e1351\u003c/a\u003e\u003c/p\u003e"}}]}]}],"_metadata":{"uid":"csdec522dacef79581"},"reference":[{"uid":"blta435fd73d14b42b4","_content_type_uid":"support_block","locale":"th-th","_version":9,"ACL":{},"_in_progress":false,"anchoring":"","background_color":"","block_description":"\u003cp\u003eหากไม่สามารถตัดสินใจได้ว่าผลิตภัณฑ์ใดที่เหมาะกับคุณ และต้องการข้อมูลเพิ่มเติม กรุณาเลือกหนึ่งในตัวเลือกด้านล่างนี้เพื่อสอบถาม\u003c/p\u003e","block_title":"สอบถามข้อมูลเพิ่มเติม","button":{"button_icon":"arrow-right","button_title":"แส ำว่า ก่อนอื่นเลย คุณต้องหาเหตุผลความจำเป็นว่าทำไมถึงต้องมีประกันชีวิต\u003c/p\u003e\u003cp\u003eตัวอย่างเช่น ถ้าคุณต้องการมีเงินเก็บ 2 ล้านบาทเพื่อใช้จ่ายหลังเกษียณ คุณต้องเลือกแบบประกันที่มีเงินออมให้คุณได้เท่ากับ 2 ล้านบาทในอนาคต\u003c/p\u003e\u003cp\u003eทั้งนี้ คุณต้องพิจารณาความสามารถในการชำระเบี้ยประกัน (รายเดือนหรือรายปี) ให้สอดคล้องกับรายรับของคุณด้วย ก่อนจะตัดสินใจเลือกแผนประกันชีวิตและค่าเบี้ยประกัน\u003c/p\u003e\u003cp\u003eเรายินดีให้คำปรึกษา หรือสามารถติดต่อผู้เชี่ยวชาญทางการเงินของเราได้ตลอดเวลา เพราะเราเข้าใจทุกความต้องการและสถานการณ์ที่แตกต่างของแต่ละคน\u003c/p\u003e"},{"question":"ชำระเบี้ยประกันเป็นรายเดือนอยู่ อยากให้หักบัญชีเงินเดือนเลยจะได้ไหม?","_metadata":{"uid":"csc1f735f3072b41b6"},"question_rich_text":"","answer":"\u003cp\u003eคุณสามารถชำระเบี้ยประกัน ผ่านบริการหักบัญชีออมทรัพย์อัตโนมัติ ได้ที่\u003c/p\u003e\u003cul\u003e\u003cli\u003eธ.กรุงเทพ\u003c/li\u003e\u003cli\u003eธ.กรุงศรีอยุธยา\u003c/li\u003e\u003cli\u003eธ.กสิกรไทย\u003c/li\u003e\u003cli\u003eธ.ไทยพาณิชย์\u003c/li\u003e\u003cli\u003eธ. กรุงไทย\u003c/li\u003e\u003cli\u003eธ. ทหารไทย\u003c/li\u003e\u003cli\u003eธ.ออมสิน\u003c/li\u003e\u003cli\u003eธ.ธนชาติ\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eกรุณาคลิกดูรายละเอียด วิธีชำระเบี้ยประกัน\u0026nbsp;\u003ca href=\"/support/premium-payment/\" target=\"_blank\"\u003e\u003cu\u003eที่นี่\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"},{"question":"ต้องการเปลี่ยนแปลงบัตรเครดิตในการชำระเบี้ยประกันภัย ต้องทำอย่างไร?","_metadata":{"uid":"cs475bea6248a0f536"},"question_rich_text":"","answer":"\u003cp\u003eสามารถยื่นคำขอเปลี่ยนแปลงบัตรเครดิตได้ด้วยตนเอง ผ่านแอป\u0026nbsp;\u003ca href=\"/omne/1step-registration-support/?utm_source=fwdcoth\u0026utm_medium=support_allfaq_support_section\u0026utm_campaign=omne_1stepregistration_download\" target=\"_blank\"\u003e\u003cu\u003eOmne by FWD\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e"},{"question":"ควรทำอย่างไร ถ้าหากมีปัญหาทางการเงินไม่สามารถชำระเบี้ยประกันต่อได้?","_metadata":{"uid":"csc8b96341324cbbbf"},"question_rich_text":"","answer":"\u003cp\u003eบริษัทพร้อมที่จะดูแลช่วยเหลือคุณ หากประสบปัญหาไม่สามารถชำระเบี้ยประกันต่อได้ ยังมีหลากหลายทางเลือกเพื่อช่วยผ่อนคลายปัญหาของคุณ ดังต่อไปนี้\u003c/p\u003e\u003cul\u003e\u003cli\u003eหากคุณต้องการเปลี่ยนแปลงการชำระเบี้ยประกันภัย ไม่ว่าจะเป็นจำนวนเงินหรือระยะเวลาในการจ่าย ติดต่อเข้ามาพูดคุยกับเรา ให้เราช่วยนำเสนอรูปแบบที่เหมาะสมสำหรับคุณ\u003c/li\u003e\u003cli\u003eขอชำระเบี้ยประกันด้วยเงินปันผลที่สะสมไว้ในกรมธรรม์ ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/cash-return-options/\" target=\"_blank\"\u003e\u003cu\u003eวิธีรับเงินคืน\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eกู้ยืมเงินจากกรมธรรม์ทั้งหมด หรือบางส่วนของมูลค่าเงินสด เพื่อนำมาชำระเบี้ยประกัน ไปที่หน้า\u0026nbsp;\u003ca href=\"/support/loan-application/\" target=\"_blank\"\u003e\u003cu\u003eบริการเงินกู้ตามกรมธรรม์\u003c/u\u003e\u003c/a\u003e\u0026nbsp;เพื่อดูรายละเอียดเพิ่มเติม\u003c/li\u003e\u003cli\u003eตัดสัญญาเพิ่มเติมบางรายการเพื่อลดจำนวนเบี้ยประกันลง\u003c/li\u003e\u003cli\u003eลดทุนประกันเพื่อลดจำนวนเบี้ยประกันที่ต้องชำระ (การลดทุนประกันมีผลทำให้ความคุ้มครองนั้นน้อยลงไปด้วย)\u003c/li\u003e\u003cli\u003eเปลี่ยนแบบประกันให้สอดคล้องกับความสามารถในการชำระเบี้ย\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eคือแนวทางในการแก้ปัญหาทั้งหมด แต่ก่อนตัดสินใจขอให้คุณมั่นใจว่าคุณได้ปรึกษาเราเพื่อหาแนวทางที่ดีที่สุดสำหรับคุณ เพราะเมื่อคุณประสบปัญหาทางการเงิน การละทิ้งกรมธรรม์หรือหายไปเฉยๆ นั้นไม่ใช่ทางออกที่ดี นอกจากจะทำให้ความคุ้มครองจากกรมธรรม์ของคุณสิ้นสุดลงแล้ว ยังทำให้คุณสูญเสียเบี้ยประกันส่วนหนึ่งที่ได้ชำระไปแล้วอีกด้วย\u003c/p\u003e\u003cp\u003eหากคุณประสบปัญหา เราพร้อมช่วยเหลือและยินดีเสนอแนวทางในกรณีที่มีปัญหาการชำระค่าเบี้ยประกัน ติดต่อหาเราที่โทร.\u0026nbsp;\u003ca href=\"tel:1351\"\u003e1351\u003c/a\u003e\u003c/p\u003e"}],"tags":[],"title":"FWD Life Saving 18/9 insurance","updated_at":"2023-04-25T09:25:05.973Z","updated_by":"blt96e98488d2398187","publish_details":{"environment":"bltd9555cb702e86a9a","locale":"th-t
