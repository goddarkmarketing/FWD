name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fwd-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, mbstring
          ini-values: disable_functions=""

      - name: Prepare CMS auth for CI
        run: php scripts/prepare-ci-auth.php

      - name: Run CMS tests
        run: php scripts/run-cms-tests.php

      - name: Build static site
        run: php scripts/build-static.php /FWD

      - name: Verify build output
        run: |
          test -f docs/index.html
          test -f docs/contact.html
          grep -q 'plan-grid' docs/index.html
          grep -q 'id="province"' docs/contact.html
          grep -q 'กรุงเทพมหานคร' docs/contact.html
          grep -q 'footer-agent' docs/index.html
          grep -q 'agent-license-open' docs/index.html
          test -f docs/assets/images/agent-license.png
          find docs -name '*.html' | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
